<div class="selector-container">
  <div class="header">
    <h1><i class="bi bi-bullseye"></i> Choose Your Learning Path</h1>
    <button (click)="navigateToCreator()" class="create-btn">
      <i class="bi bi-plus-circle"></i> Create Your Own Skill
    </button>
  </div>
  
  <div class="tabs">
    <button [class.active]="activeTab === 'all'" (click)="activeTab = 'all'">
      All Skills
    </button>
    <button [class.active]="activeTab === 'predefined'" (click)="activeTab = 'predefined'">
      Featured Skills
    </button>
    <button [class.active]="activeTab === 'custom'" (click)="activeTab = 'custom'">
      My Creations
    </button>
  </div>
  
  <div class="skills-grid">
    <div *ngFor="let skill of displayedSkills" 
         class="skill-card"
         [class.custom]="skill.isCustom"
         [routerLink]="['/skills', skill.id]">
      <div class="skill-icon">
        <i [class]="skill.icon" *ngIf="skill.icon.startsWith('bi bi-')"></i>
        <span *ngIf="!skill.icon.startsWith('bi bi-')">{{ skill.icon }}</span>
      </div>
      <h3>{{ skill.name }}</h3>
      <p>{{ skill.subSkills.length }} sub-skills</p>
      <div class="skill-meta">
        <span *ngIf="skill.isCustom" class="custom-badge"><i class="bi bi-stars"></i> Custom</span>
        <span *ngIf="!skill.isCustom" class="featured-badge"><i class="bi bi-star-fill"></i> Featured</span>
      </div>
      <button *ngIf="skill.isCustom" 
              (click)="deleteSkill(skill.id, $event)"
              class="delete-btn"
              title="Delete skill">
        <i class="bi bi-trash3"></i>
      </button>
    </div>
  </div>
</div>
