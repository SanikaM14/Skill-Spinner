<div class="skill-card" [ngClass]="{'completed': skill.completed}">
  <div class="skill-header">
    <input type="checkbox" 
           [checked]="skill.completed"
           (change)="onToggle()"
           class="skill-checkbox">
    <h3 [ngStyle]="{'text-decoration': skill.completed ? 'line-through' : 'none',
                    'color': skill.completed ? '#888' : '#333'}">
      {{ skill.name }}
    </h3>
    <div class="header-buttons">
      <button (click)="toggleResources()" class="resources-button">
        <i class="bi bi-book"></i> {{ showResources ? 'Hide' : 'Show' }} Resources
      </button>
      <button *ngIf="isCustomSkill" 
              (click)="onDelete()" 
              class="delete-btn"
              title="Delete sub-skill">
        <i class="bi bi-trash3"></i>
      </button>
    </div>
  </div>
  
  <p class="skill-description">{{ skill.description }}</p>
  
  <div *ngIf="showResources && skill.resources" class="resources">
    <div *ngIf="skill.resources.youtubeUrl" class="resource-item">
      <strong><i class="bi bi-play-circle"></i> Watch:</strong>
      <a [href]="skill.resources.youtubeUrl" target="_blank">Video Tutorial</a>
    </div>
    
    <div *ngIf="skill.resources.prompt" class="resource-item">
      <strong><i class="bi bi-robot"></i> ChatGPT Prompt:</strong>
      <p class="prompt-text">{{ skill.resources.prompt }}</p>
      <button (click)="copyToClipboard(skill.resources.prompt)" class="copy-btn">
        <i class="bi bi-clipboard"></i> Copy Prompt
      </button>
    </div>
    
    <div *ngIf="skill.resources.estimatedTime" class="resource-item">
      <strong><i class="bi bi-clock"></i> Estimated Time:</strong> {{ skill.resources.estimatedTime }}
    </div>
  </div>
</div>
